name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Validate authored data
        run: dotnet run --project tools/Paddock.DataPipeline --configuration Release --no-build -- validate-authored

      - name: Bridge types match the registry
        run: dotnet run --project tools/Paddock.TypeGen --configuration Release --no-build -- --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: UI app
        working-directory: ui/app
        run: npm ci && npm test && npm run check && npm run build

      - name: UI prototype tests
        run: node --test "ui/prototype/tests/*.test.mjs"

      - name: Docs tests
        run: node --test "tools/docs/*.test.mjs"

      - name: Build HTML docs (fails on a constant GUIDE.md names that the code lost)
        run: node tools/docs/build-docs.mjs
